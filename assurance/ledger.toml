# Each published package has one package-level public surface.  Exact API units
# in the snapshot point to one of these IDs; semantic cryptographic distinctions
# are recorded in atomic-operations.toml.

[[surface]]
id = "internal-support"
package = "dcrypt-internal"
classification = "security-support"
status = "internal-public"

[[surface]]
id = "parameter-data"
package = "dcrypt-params"
classification = "cryptographic-parameter-data"
status = "supported"

[[surface]]
id = "api-contracts"
package = "dcrypt-api"
classification = "security-api-and-compatibility"
status = "supported"

[[surface]]
id = "common-support"
package = "dcrypt-common"
classification = "secret-handling-and-math-support"
status = "supported"

[[surface]]
id = "algorithm-primitives"
package = "dcrypt-algorithms"
classification = "cryptographic-primitives-and-low-level-support"
status = "supported"

[[surface]]
id = "symmetric-constructions"
package = "dcrypt-symmetric"
classification = "cryptographic-construction"
status = "supported"

[[surface]]
id = "kem-constructions"
package = "dcrypt-kem"
classification = "key-establishment"
status = "supported"

[[surface]]
id = "signature-constructions"
package = "dcrypt-sign"
classification = "digital-signature"
status = "supported"

[[surface]]
id = "pke-constructions"
package = "dcrypt-pke"
classification = "public-key-encryption"
status = "supported"

[[surface]]
id = "utility-surface"
package = "dcrypt-utils"
classification = "non-security-utility"
status = "internal-public"

[[surface]]
id = "hybrid-constructions"
package = "dcrypt-hybrid"
classification = "hybrid-cryptographic-construction"
status = "supported"

[[surface]]
id = "facade-surface"
package = "dcrypt"
classification = "public-facade-and-reexports"
status = "supported"

# Profile rows are independent of algorithm operations.  The verifier requires
# exact agreement between these rows and implementation-boundary.toml.

