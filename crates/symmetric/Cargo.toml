[package]
name = "dcrypt-symmetric"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Symmetric encryption algorithms for the dcrypt library"
repository.workspace = true
license.workspace = true
publish = true

[features]
default = ["std"]
std = [
    "alloc",
    "dcrypt-api/std",
    "dcrypt-internal/std",
    "dcrypt-algorithms/std",
]
alloc = [
    "dcrypt-api/alloc",
    "dcrypt-internal/alloc",
    "dcrypt-algorithms/alloc",
]
no_std = ["alloc"]

[dependencies]
dcrypt-api = { path = "../api", version = "=3.0.0", default-features = false, features = ["alloc"] }
dcrypt-internal = { path = "../internal", version = "=3.0.0", default-features = false, features = ["alloc"] }
dcrypt-params = { path = "../params", version = "=3.0.0" }
dcrypt-algorithms = { path = "../algorithms", version = "=3.0.0", default-features = false, features = ["aead", "block", "hash", "kdf", "mac", "stream"] }
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }

[package.metadata.release]
publish = true

[lints]
workspace = true
