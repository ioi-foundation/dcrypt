[package]
name = "dcrypt-sign"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Digital Signature Schemes for the dcrypt library"
repository.workspace = true
license.workspace = true
publish = true


[features]
trace = []
default = ["std"]
std = [
    "alloc",
    "dcrypt-api/std", 
    "dcrypt-common/std", 
    "dcrypt-internal/std"
]
no_std = [
    "alloc",
    "dcrypt-api/no_std", 
    "dcrypt-common/no_std", 
    "dcrypt-internal/no_std"
]
alloc = ["dcrypt-api/alloc", "dcrypt-common/alloc", "dcrypt-internal/alloc", "dcrypt-algorithms/alloc"]
traditional = []  # Feature flag for traditional signatures (ECDSA, EdDSA, RSA, etc.)
post-quantum = [] # Feature flag for post-quantum signatures (Dilithium, Falcon, etc.)

[dependencies]
dcrypt-api = { path = "../api", version = "=2.0.0", default-features = false }
dcrypt-common = { path = "../common", version = "=2.0.0", default-features = false }
dcrypt-internal = { path = "../internal", version = "=2.0.0", default-features = false }
dcrypt-params = { path = "../params", version = "=2.0.0" }
dcrypt-algorithms = { path = "../algorithms", version = "=2.0.0" }
libcrux-ml-dsa = { version = "=0.0.10", default-features = false, features = ["mldsa44", "mldsa65", "mldsa87"] }
zeroize = { workspace = true }
rand = { workspace = true }
subtle = "2.5"

[dev-dependencies]
rand_chacha = { workspace = true }
hex = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }
fips204 = { version = "0.4.6", default-features = false, features = ["ml-dsa-44", "ml-dsa-65", "ml-dsa-87"] }

[[bench]]
name = "dilithium"
harness = false

[package.metadata.release]
publish = true

[lints]
workspace = true
