[package]
name = "dcrypt-kem"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Key Encapsulation Mechanisms for the dcrypt library"
repository.workspace = true
license.workspace = true
publish = true

[features]
default = ["std", "traditional", "post-quantum"]
std = [
    "dcrypt-api/std", 
    "dcrypt-common/std", 
    "dcrypt-internal/std",
    "dcrypt-algorithms/std",
    "alloc"
]
no_std = [
    "dcrypt-api/no_std", 
    "dcrypt-common/no_std", 
    "dcrypt-internal/no_std",
    "alloc"
]
alloc = [
    "dcrypt-api/alloc",
    "dcrypt-common/alloc",
    "dcrypt-internal/alloc",
    "dcrypt-algorithms/alloc",
]
traditional = ["alloc"] # ECDH KEMs
post-quantum = ["alloc"] # FIPS 203 ML-KEM

[dependencies]
dcrypt-api = { path = "../api", version = "=2.0.0", default-features = false }
dcrypt-common = { path = "../common", version = "=2.0.0", default-features = false }
dcrypt-internal = { path = "../internal", version = "=2.0.0", default-features = false }
dcrypt-algorithms = { path = "../algorithms", version = "=2.0.0", default-features = false, features = ["alloc", "ec", "hash", "mac", "xof"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "ml_kem"
harness = false

[[bench]]
name = "ecdh_p256"
harness = false

[[bench]]
name = "ecdh_p384"
harness = false

[[bench]]
name = "ecdh_p521"
harness = false

[[bench]]
name = "ecdh_k256"
harness = false

[[bench]]
name = "ecdh_comparison"
harness = false

[package.metadata.release]
publish = true

[lints]
workspace = true
