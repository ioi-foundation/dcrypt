[package]
name = "dcrypt-hybrid"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Hybrid cryptography schemes for the dcrypt library"
repository.workspace = true
license.workspace = true
publish = true

[features]
default = ["std"]
std = [
    "dcrypt-api/std", 
    "dcrypt-common/std", 
    "dcrypt-internal/std",
    "dcrypt-algorithms/std",
    "dcrypt-kem/std",
    "dcrypt-sign/std",
    "alloc"
]
alloc = [
    "dcrypt-api/alloc",
    "dcrypt-common/alloc",
    "dcrypt-internal/alloc",
    "dcrypt-algorithms/alloc",
    "dcrypt-kem/alloc",
    "dcrypt-sign/alloc",
]
no_std = [
    "dcrypt-api/no_std", 
    "dcrypt-common/no_std", 
    "dcrypt-internal/no_std",
    "alloc"
]
[dependencies]
dcrypt-api = { path = "../api", version = "=2.0.0", default-features = false }
dcrypt-common = { path = "../common", version = "=2.0.0", default-features = false }
dcrypt-internal = { path = "../internal", version = "=2.0.0", default-features = false }
dcrypt-params = { path = "../params", version = "=2.0.0" }
dcrypt-algorithms = { path = "../algorithms", version = "=2.0.0", default-features = false, features = ["alloc", "hash", "kdf", "mac"] }
dcrypt-kem = { path = "../kem", version = "=2.0.0", default-features = false, features = ["alloc", "traditional", "post-quantum"] }
dcrypt-sign = { path = "../sign", version = "=2.0.0", default-features = false, features = ["alloc", "traditional", "post-quantum"] }

[dev-dependencies]
rand = { version = "=0.8.7" }
rand_chacha = { workspace = true }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "hybrid_kem"
harness = false

[[bench]]
name = "hybrid_sign"
harness = false

[package.metadata.release]
publish = true

[lints]
workspace = true
