[package]
name = "dcrypt-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
dcrypt-api = { version = "=3.0.0", path = "../crates/api" }
dcrypt-algorithms = { version = "=3.0.0", path = "../crates/algorithms", features = ["ec"] }
dcrypt-hybrid = { version = "=3.0.0", path = "../crates/hybrid" }
dcrypt-kem = { version = "=3.0.0", path = "../crates/kem", features = ["post-quantum", "traditional"] }
dcrypt-pke = { version = "=3.0.0", path = "../crates/pke" }
dcrypt-sign = { version = "=3.0.0", path = "../crates/sign" }
dcrypt-symmetric = { version = "=3.0.0", path = "../crates/symmetric" }
dcrypt-legacy-xchacha20poly1305-migration = { version = "=0.0.0", path = "../migration/legacy-xchacha20poly1305" }

[[bin]]
name = "signature_decoders"
path = "fuzz_targets/signature_decoders.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hybrid_decoders"
path = "fuzz_targets/hybrid_decoders.rs"
test = false
doc = false
bench = false

[[bin]]
name = "symmetric_decoders"
