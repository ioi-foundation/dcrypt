[workspace]
members = ["."]
resolver = "2"

[package]
name = "dcrypt-verification"
version = "0.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
bls12_381 = { version = "=0.8.0", default-features = false, features = ["alloc", "experimental", "groups", "pairings"] }
dcrypt-algorithms = { version = "=2.0.0", path = "../crates/algorithms" }
dcrypt-api = { version = "=2.0.0", path = "../crates/api" }
dcrypt-internal = { version = "=2.0.0", path = "../crates/internal" }
dcrypt-sign = { version = "=2.0.0", path = "../crates/sign" }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
chacha20 = { version = "=0.9.1", default-features = false }
dcrypt-legacy-xchacha20poly1305-migration = { version = "=0.0.0", path = "../migration/legacy-xchacha20poly1305" }
fips204 = { version = "=0.4.6", default-features = false, features = ["ml-dsa-44", "ml-dsa-65", "ml-dsa-87"] }
hkdf = "=0.12.4"
k256 = { version = "=0.13.4", default-features = false, features = ["arithmetic", "ecdh"] }
libcrux-ml-dsa = { version = "=0.0.10", default-features = false, features = ["acvp", "mldsa44", "mldsa65", "mldsa87"] }
ml-dsa = { version = "=0.1.1", default-features = false }
p224 = { version = "=0.13.2", default-features = false, features = ["arithmetic", "ecdh"] }
p256 = { version = "=0.13.2", default-features = false, features = ["arithmetic", "ecdh"] }
p384 = { version = "=0.13.1", default-features = false, features = ["arithmetic", "ecdh"] }
p521 = { version = "=0.13.3", default-features = false, features = ["arithmetic", "ecdh"] }
rand = { version = "=0.8.6", default-features = false }
rand_chacha = "=0.3.1"
sha2 = "=0.9.9"
sha2_010 = { package = "sha2", version = "=0.10.9" }
