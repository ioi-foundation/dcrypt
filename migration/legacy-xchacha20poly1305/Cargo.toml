[package]
name = "dcrypt-legacy-xchacha20poly1305-migration"
version = "0.0.0"
edition = "2021"
publish = false
description = "Isolated decrypt-only migration tool for dcrypt v0.5.0 through v1.2.3 custom XChaCha ciphertext"
license = "Apache-2.0"

[dependencies]
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
dcrypt-algorithms = { version = "=4.0.1", path = "../../crates/algorithms", default-features = false, features = ["alloc", "aead", "stream"] }
dcrypt-internal = { version = "=4.0.1", path = "../../crates/internal", default-features = false, features = ["alloc"] }

[workspace]
members = ["."]
resolver = "2"

[lints.rust]
unsafe_code = "forbid"
