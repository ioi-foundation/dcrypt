[package]
name = "dcrypt-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Testing utilities and benchmarks for the dcrypt library"
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
dcrypt-kem = { path = "../crates/kem", version = "=4.0.1" }
dcrypt-sign = { path = "../crates/sign", version = "=4.0.1" }
dcrypt-algorithms = { path = "../crates/algorithms", version = "=4.0.1" }
dcrypt-params = { path = "../crates/params", version = "=4.0.1" }
dcrypt-symmetric = { path = "../crates/symmetric", version = "=4.0.1" }
dcrypt-hybrid = { path = "../crates/hybrid", version = "=4.0.1" }
dcrypt-api = { version = "=4.0.1", path = "../crates/api" }
dcrypt-common = { path = "../crates/common" , version = "=4.0.1" }
dcrypt-internal = { path = "../crates/internal" , version = "=4.0.1" }
rand = { workspace = true, features = ["std", "std_rng", "getrandom"] }
rand_chacha = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
once_cell = "1"
hex = "0.4"
thiserror = "1"
arrayref = "0.3"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[lints]
workspace = true
