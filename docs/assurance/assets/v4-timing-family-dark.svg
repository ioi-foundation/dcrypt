<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 1000" width="1200" height="1000">
  <title id="title">dcrypt 4.0.0 timing-family evidence</title>
  <desc id="desc">Per-case primary p-values from the Baseline and Reproduction timing families on a logarithmic scale. Every case in both complete passes recorded no Holm reject and no release block under the family-wise policy.</desc>
