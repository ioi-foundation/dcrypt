<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 620" width="1200" height="620">
  <title id="title">dcrypt 4.0.0 Assurance Profile overview</title>
  <desc id="desc">Four separate evidence panels: calibrated simulation with the leakage-detector calibration on a logarithmic t-statistic scale, measured product evidence, repository-corpus correctness with the ML-DSA and ML-KEM case split, and supply-chain and build evidence. No composite score is shown.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #0b0b0b; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .h1 { font-size: 24px; font-weight: 700; }
    .sub { font-size: 13px; fill: #52514e; }
    .clabel { font-size: 13px; font-weight: 600; fill: #52514e; }
    .value { font-size: 40px; font-weight: 700; }
    .vlabel { font-size: 13px; fill: #52514e; }
    .stat { font-size: 13px; fill: #52514e; }
    .name { font-size: 13px; }
    .head { font-size: 15px; font-weight: 700; }
    .small { font-size: 11px; fill: #898781; }
    .note { font-size: 12px; fill: #898781; }
    .tick { font-size: 12px; fill: #898781; }
    .thr { font-size: 11px; fill: #52514e; }
    .card { fill: #fcfcfb; stroke: #e4e3de; stroke-width: 1; }
    .grid { stroke: #e1e0d9; stroke-width: 1; }
  </style>
  <rect width="1200" height="620" fill="#ffffff"/>

  <text x="48" y="52" class="h1">Assurance Profile · 4.0.0</text>
  <text x="48" y="78" class="sub">Released evidence for one exact subject — separate signals, no composite score.</text>
  <text x="1152" y="40" text-anchor="end" class="mono small">commit 0d014c306c37</text>
  <text x="1152" y="58" text-anchor="end" class="mono small">profile sha256 3233e23a2b78</text>
  <rect x="48" y="104" width="540" height="200" rx="6" class="card"/>
  <text x="72" y="138" class="clabel">Calibrated simulation</text>
  <text x="72" y="192" class="value">432 / 432</text>
  <text x="72" y="216" class="vlabel">injected single-bit artifact faults detected</text>
  <text x="72" y="240" class="small">leakage-detector calibration · absolute t, log scale · 20,000 samples/class</text>
  <line x1="72.0" y1="270" x2="564.0" y2="270" stroke="#c3c2b7" stroke-width="1"/>
  <line x1="72.0" y1="270" x2="72.0" y2="274" stroke="#c3c2b7" stroke-width="1"/>
  <text x="72.0" y="288" text-anchor="middle" class="small">0.1</text>
  <line x1="195.0" y1="270" x2="195.0" y2="274" stroke="#c3c2b7" stroke-width="1"/>
  <text x="195.0" y="288" text-anchor="middle" class="small">1</text>
  <line x1="318.0" y1="270" x2="318.0" y2="274" stroke="#c3c2b7" stroke-width="1"/>
  <text x="318.0" y="288" text-anchor="middle" class="small">10</text>
  <line x1="441.0" y1="270" x2="441.0" y2="274" stroke="#c3c2b7" stroke-width="1"/>
  <text x="441.0" y="288" text-anchor="middle" class="small">100</text>
  <line x1="564.0" y1="270" x2="564.0" y2="274" stroke="#c3c2b7" stroke-width="1"/>
  <text x="564.0" y="288" text-anchor="middle" class="small">1000</text>
  <line x1="275.35" y1="260" x2="275.35" y2="276" stroke="#52514e" stroke-width="1.5"/>
  <text x="275.35" y="256" text-anchor="middle" class="thr">threshold 4.5</text>
  <circle cx="171.21" cy="270" r="5" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
  <text x="171.21" y="256" text-anchor="middle" class="small">negative 0.64</text>
  <circle cx="502.95" cy="270" r="5" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
  <text x="502.95" y="256" text-anchor="middle" class="small">positive 318.93</text>
  <rect x="612" y="104" width="540" height="200" rx="6" class="card"/>
  <text x="636" y="138" class="clabel">Measured product evidence</text>
  <text x="636" y="192" class="value">29 × 2</text>
  <text x="636" y="216" class="vlabel">timing-sensitive cases × complete passes</text>
  <path d="M636.00 249.00 l4.2 4.2 l7.6 -8.8" fill="none" stroke="#006300" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="658" y="254" class="stat">0 suite-wide Holm rejects across both passes</text>
  <path d="M636.00 277.00 l4.2 4.2 l7.6 -8.8" fill="none" stroke="#006300" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="658" y="282" class="stat">11 / 11 historical vulnerability classes replayed</text>
  <rect x="48" y="328" width="540" height="200" rx="6" class="card"/>
  <text x="72" y="362" class="clabel">Repository-corpus correctness</text>
  <text x="72" y="416" class="value">855</text>
  <text x="72" y="440" class="vlabel">exact post-quantum vector cases</text>
  <text x="72" y="464" class="small">byte-bound ACVP-format corpus · repository correctness, not NIST validation</text>
  <clipPath id="corpus-light"><rect x="72" y="476" width="492" height="12" rx="5"/></clipPath>
  <g clip-path="url(#corpus-light)">
    <rect x="72" y="476" width="352.46" height="12" fill="#2a78d6"/>
    <rect x="426.46" y="476" width="137.54" height="12" fill="#eb6834"/>
  </g>
  <rect x="72" y="502" width="9" height="9" rx="2" fill="#2a78d6"/>
  <text x="87" y="511" class="stat">ML-DSA · 615 cases</text>
  <rect x="272" y="502" width="9" height="9" rx="2" fill="#eb6834"/>
  <text x="287" y="511" class="stat">ML-KEM · 240 cases</text>
  <rect x="612" y="328" width="540" height="200" rx="6" class="card"/>
  <text x="636" y="362" class="clabel">Supply chain and build surface</text>
  <text x="636" y="416" class="value">12 / 12</text>
  <text x="636" y="440" class="vlabel">byte-equal package rebuilds</text>
  <path d="M636.00 473.00 l4.2 4.2 l7.6 -8.8" fill="none" stroke="#006300" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="658" y="478" class="stat">5 deterministic software inventories (SBOMs)</text>
  <path d="M636.00 501.00 l4.2 4.2 l7.6 -8.8" fill="none" stroke="#006300" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="658" y="506" class="stat">4 configured target profiles</text>
  <line x1="48" y1="560" x2="1152" y2="560" class="grid"/>
  <text x="48" y="586" class="note">Separate signals — no composite score · Calibrated simulation is not physical-device evidence · Corpus passes are not NIST validation</text>
</svg>
