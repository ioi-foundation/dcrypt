<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 392" width="1200" height="392">
  <title id="title">dcrypt 4.0.0 evidence path</title>
  <desc id="desc">The exact release subject enters the open laboratory, produces a verified manifest, and is projected into public profile and report artifacts. Physical-device resistance, independent audit, FIPS validation, and formal proof remain outside the demonstrated path.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #0b0b0b; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .h1 { font-size: 24px; font-weight: 700; }
    .sub { font-size: 13px; fill: #52514e; }
    .clabel { font-size: 13px; font-weight: 600; fill: #52514e; }
    .value { font-size: 40px; font-weight: 700; }
    .vlabel { font-size: 13px; fill: #52514e; }
    .stat { font-size: 13px; fill: #52514e; }
    .name { font-size: 13px; }
    .head { font-size: 15px; font-weight: 700; }
    .small { font-size: 11px; fill: #898781; }
    .note { font-size: 12px; fill: #898781; }
    .tick { font-size: 12px; fill: #898781; }
    .thr { font-size: 11px; fill: #52514e; }
    .card { fill: #fcfcfb; stroke: #e4e3de; stroke-width: 1; }
    .grid { stroke: #e1e0d9; stroke-width: 1; }
  </style>
  <rect width="1200" height="392" fill="#ffffff"/>

